services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["5432:5432"]
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tickets
      DB_POOL_SIZE: "40"
      PAYMENT_DECLINE_RATE: "0.1"
      PAYMENT_LATENCY_MS: "50"
    ports: ["3000:3000"]
